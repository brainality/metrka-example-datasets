services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: metrka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrka"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - metrka-example-postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  metrka-example-postgres:
